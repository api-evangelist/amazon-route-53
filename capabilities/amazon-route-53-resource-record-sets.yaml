naftiko: 1.0.0-alpha2
info:
  label: Amazon Route 53 API — Resource Record Sets
  description: 'Amazon Route 53 API — Resource Record Sets. 2 operations. Lead operation: Amazon Route 53 Create, update,
    or delete resource record sets. Self-contained Naftiko capability covering one Amazon Route 53 business surface.'
  tags:
  - Amazon Route 53
  - Resource Record Sets
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AMAZON_ROUTE_53_API_KEY: AMAZON_ROUTE_53_API_KEY
capability:
  consumes:
  - type: http
    namespace: amazon-route-53-resource-record-sets
    baseUri: https://route53.amazonaws.com
    description: Amazon Route 53 API — Resource Record Sets business capability. Self-contained, no shared references.
    resources:
    - name: 2013-04-01-hostedzone-Id-rrset
      path: /2013-04-01/hostedzone/{Id}/rrset
      operations:
      - name: changeresourcerecordsets
        method: POST
        description: Amazon Route 53 Create, update, or delete resource record sets
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: Id
          in: path
          type: string
          description: The ID of the hosted zone that contains the resource record sets.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: listresourcerecordsets
        method: GET
        description: Amazon Route 53 List resource record sets
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: Id
          in: path
          type: string
          description: The ID of the hosted zone that contains the resource record sets.
          required: true
        - name: type
          in: query
          type: string
          description: The type of resource record set to begin the record listing from.
        - name: name
          in: query
          type: string
          description: The first name in the lexicographic ordering of resource record sets to list.
        - name: maxitems
          in: query
          type: integer
          description: The maximum number of records to include in the response.
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.AMAZON_ROUTE_53_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: amazon-route-53-resource-record-sets-rest
    port: 8080
    description: REST adapter for Amazon Route 53 API — Resource Record Sets. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/2013-04-01/hostedzone/{id}/rrset
      name: 2013-04-01-hostedzone-id-rrset
      description: REST surface for 2013-04-01-hostedzone-Id-rrset.
      operations:
      - method: POST
        name: changeresourcerecordsets
        description: Amazon Route 53 Create, update, or delete resource record sets
        call: amazon-route-53-resource-record-sets.changeresourcerecordsets
        with:
          Id: rest.Id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: listresourcerecordsets
        description: Amazon Route 53 List resource record sets
        call: amazon-route-53-resource-record-sets.listresourcerecordsets
        with:
          Id: rest.Id
          type: rest.type
          name: rest.name
          maxitems: rest.maxitems
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: amazon-route-53-resource-record-sets-mcp
    port: 9090
    transport: http
    description: MCP adapter for Amazon Route 53 API — Resource Record Sets. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: amazon-route-53-create-update
      description: Amazon Route 53 Create, update, or delete resource record sets
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: amazon-route-53-resource-record-sets.changeresourcerecordsets
      with:
        Id: tools.Id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: amazon-route-53-list-resource
      description: Amazon Route 53 List resource record sets
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: amazon-route-53-resource-record-sets.listresourcerecordsets
      with:
        Id: tools.Id
        type: tools.type
        name: tools.name
        maxitems: tools.maxitems
      outputParameters:
      - type: object
        mapping: $.
