        name: gethostedzone
        description: Amazon Route 53 Get hosted zone details
        call: amazon-route-53-hosted-zones.gethostedzone
        with:
          Id: rest.Id
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletehostedzone
        description: Amazon Route 53 Delete a hosted zone
        call: amazon-route-53-hosted-zones.deletehostedzone
        with:
          Id: rest.Id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
