    namespace: amazon-route-53-hosted-zones
    baseUri: https://route53.amazonaws.com
    description: Amazon Route 53 API — Hosted Zones business capability. Self-contained, no shared references.
    resources:
    - name: 2013-04-01-hostedzone
      path: /2013-04-01/hostedzone
      operations:
      - name: createhostedzone
        method: POST
        description: Amazon Route 53 Create a hosted zone
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: listhostedzones
        method: GET
        description: Amazon Route 53 List hosted zones
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: marker
          in: query
          type: string
          description: The value that you specified for the marker parameter in the request to get the next page of results.
        - name: maxitems
          in: query
          type: integer
          description: The maximum number of hosted zones to include in the response body.
    - name: 2013-04-01-hostedzone-Id
      path: /2013-04-01/hostedzone/{Id}
      operations:
      - name: gethostedzone
        method: GET
        description: Amazon Route 53 Get hosted zone details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: Id
          in: path
          type: string
          description: The ID of the hosted zone to retrieve.
          required: true
      - name: deletehostedzone
        method: DELETE
        description: Amazon Route 53 Delete a hosted zone
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: Id
          in: path
          type: string
          description: The ID of the hosted zone to delete.
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.AMAZON_ROUTE_53_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: amazon-route-53-hosted-zones-rest
    port: 8080
    description: REST adapter for Amazon Route 53 API — Hosted Zones. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/2013-04-01/hostedzone
      name: 2013-04-01-hostedzone
      description: REST surface for 2013-04-01-hostedzone.
      operations:
      - method: POST
        name: createhostedzone
        description: Amazon Route 53 Create a hosted zone
        call: amazon-route-53-hosted-zones.createhostedzone
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: listhostedzones
        description: Amazon Route 53 List hosted zones
        call: amazon-route-53-hosted-zones.listhostedzones
        with:
          marker: rest.marker
          maxitems: rest.maxitems
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/2013-04-01/hostedzone/{id}
      name: 2013-04-01-hostedzone-id
      description: REST surface for 2013-04-01-hostedzone-Id.
      operations:
