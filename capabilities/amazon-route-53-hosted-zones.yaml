naftiko: 1.0.0-alpha2
info:
  label: Amazon Route 53 API — Hosted Zones
  description: 'Amazon Route 53 API — Hosted Zones. 4 operations. Lead operation: Amazon Route 53 Create a hosted zone. Self-contained
    Naftiko capability covering one Amazon Route 53 business surface.'
  tags:
  - Amazon Route 53
  - Hosted Zones
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AMAZON_ROUTE_53_API_KEY: AMAZON_ROUTE_53_API_KEY
capability:
