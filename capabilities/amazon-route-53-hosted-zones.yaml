    port: 9090
    transport: http
    description: MCP adapter for Amazon Route 53 API — Hosted Zones. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: amazon-route-53-create-hosted
      description: Amazon Route 53 Create a hosted zone
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: amazon-route-53-hosted-zones.createhostedzone
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: amazon-route-53-list-hosted
      description: Amazon Route 53 List hosted zones
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: amazon-route-53-hosted-zones.listhostedzones
      with:
        marker: tools.marker
        maxitems: tools.maxitems
      outputParameters:
      - type: object
        mapping: $.
    - name: amazon-route-53-get-hosted
      description: Amazon Route 53 Get hosted zone details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: amazon-route-53-hosted-zones.gethostedzone
      with:
        Id: tools.Id
      outputParameters:
      - type: object
        mapping: $.
    - name: amazon-route-53-delete-hosted
      description: Amazon Route 53 Delete a hosted zone
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: amazon-route-53-hosted-zones.deletehostedzone
      with:
        Id: tools.Id
      outputParameters:
      - type: object
        mapping: $.
