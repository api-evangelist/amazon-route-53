naftiko: 1.0.0-alpha2
info:
  label: Amazon Route 53 Operations
  description: Workflow capability for Amazon Route 53. Enables automation of Amazon Route 53 resources for cloud operations
    teams.
  tags:
  - Amazon Route 53
  - AWS
  - Cloud Operations
  created: '2026-04-19'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    AWS_ACCESS_KEY: AWS_ACCESS_KEY
    AWS_SECRET_KEY: AWS_SECRET_KEY
capability:
  consumes:
  - type: http
    namespace: amazon-route-53
    baseUri: https://route53.amazonaws.com
    description: Amazon Route 53 API
    authentication:
      type: bearer
      token: '{{AWS_ACCESS_KEY}}'
    resources:
    - name: '2013-04-01'
      path: /2013-04-01/hostedzone
      description: 2013-04-01 operations
      operations:
      - name: ListHostedZones
        method: GET
        description: Amazon Route 53 List hosted zones
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: CreateHostedZone
        method: POST
        description: Amazon Route 53 Create a hosted zone
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: GetHostedZone
        method: GET
        description: Amazon Route 53 Get hosted zone details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: DeleteHostedZone
        method: DELETE
        description: Amazon Route 53 Delete a hosted zone
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: ListResourceRecordSets
        method: GET
        description: Amazon Route 53 List resource record sets
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: ChangeResourceRecordSets
        method: POST
        description: Amazon Route 53 Create, update, or delete resource record sets
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: ListHealthChecks
        method: GET
        description: Amazon Route 53 List health checks
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: CreateHealthCheck
        method: POST
        description: Amazon Route 53 Create a health check
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: GetHealthCheck
        method: GET
        description: Amazon Route 53 Get health check details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: amazon-route-53-api
    description: Unified REST API for Amazon Route 53 operations.
    resources:
    - path: /v1/resources
      name: resources
      description: Amazon Route 53 resources
      operations:
      - method: GET
        name: list-resources
        description: List Amazon Route 53 resources
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: amazon-route-53-mcp
    transport: http
    description: MCP server for AI-assisted Amazon Route 53 operations.
    tools:
    - name: list-amazon-route-53-resources
      description: List Amazon Route 53 resources
      hints:
        readOnly: true
      outputParameters:
      - type: object
        mapping: $.
