naftiko: 1.0.0-alpha1
info:
  label: Amazon Route 53 API
  description: >-
    Amazon Route 53 is a highly available and scalable Domain Name System (DNS)
    web service that provides DNS routing, domain name registration, and health
    checking capabilities. It connects user requests to internet applications
    running on AWS or on-premises infrastructure.
  tags:
  - Amazon Route 53
  - AWS
  created: '2026-04-19'
  modified: '2026-04-19'
binds:
- namespace: env
  keys:
    AMAZON_ROUTE_53_API_KEY: AMAZON_ROUTE_53_API_KEY
capability:
  consumes:
  - type: http
    namespace: amazon-route-53
    baseUri: https://route53.amazonaws.com
    description: Amazon Route 53 API
    authentication:
      type: bearer
      token: '{{AWS_ACCESS_KEY}}'
    resources:
    - name: '2013-04-01'
      path: /2013-04-01/hostedzone
      description: 2013-04-01 operations
      operations:
      - name: ListHostedZones
        method: GET
        description: Amazon Route 53 List hosted zones
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: CreateHostedZone
        method: POST
        description: Amazon Route 53 Create a hosted zone
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: GetHostedZone
        method: GET
        description: Amazon Route 53 Get hosted zone details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: DeleteHostedZone
        method: DELETE
        description: Amazon Route 53 Delete a hosted zone
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: ListResourceRecordSets
        method: GET
        description: Amazon Route 53 List resource record sets
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: ChangeResourceRecordSets
        method: POST
        description: Amazon Route 53 Create, update, or delete resource record sets
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: ListHealthChecks
        method: GET
        description: Amazon Route 53 List health checks
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: CreateHealthCheck
        method: POST
        description: Amazon Route 53 Create a health check
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: GetHealthCheck
        method: GET
        description: Amazon Route 53 Get health check details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
