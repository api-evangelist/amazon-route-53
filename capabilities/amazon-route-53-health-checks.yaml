naftiko: 1.0.0-alpha2
info:
  label: Amazon Route 53 API — Health Checks
  description: 'Amazon Route 53 API — Health Checks. 3 operations. Lead operation: Amazon Route 53 Create a health check.
    Self-contained Naftiko capability covering one Amazon Route 53 business surface.'
  tags:
  - Amazon Route 53
  - Health Checks
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AMAZON_ROUTE_53_API_KEY: AMAZON_ROUTE_53_API_KEY
capability:
  consumes:
  - type: http
    namespace: amazon-route-53-health-checks
    baseUri: https://route53.amazonaws.com
    description: Amazon Route 53 API — Health Checks business capability. Self-contained, no shared references.
    resources:
    - name: 2013-04-01-healthcheck
      path: /2013-04-01/healthcheck
      operations:
      - name: createhealthcheck
        method: POST
        description: Amazon Route 53 Create a health check
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: listhealthchecks
        method: GET
        description: Amazon Route 53 List health checks
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: marker
          in: query
          type: string
          description: The value to use for the marker parameter in a subsequent request.
        - name: maxitems
          in: query
          type: integer
          description: The maximum number of health checks to include in the response.
    - name: 2013-04-01-healthcheck-HealthCheckId
      path: /2013-04-01/healthcheck/{HealthCheckId}
      operations:
      - name: gethealthcheck
        method: GET
        description: Amazon Route 53 Get health check details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: HealthCheckId
          in: path
          type: string
          description: The ID of the health check to retrieve.
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.AMAZON_ROUTE_53_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: amazon-route-53-health-checks-rest
    port: 8080
    description: REST adapter for Amazon Route 53 API — Health Checks. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/2013-04-01/healthcheck
      name: 2013-04-01-healthcheck
      description: REST surface for 2013-04-01-healthcheck.
      operations:
      - method: POST
        name: createhealthcheck
        description: Amazon Route 53 Create a health check
        call: amazon-route-53-health-checks.createhealthcheck
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: listhealthchecks
        description: Amazon Route 53 List health checks
        call: amazon-route-53-health-checks.listhealthchecks
        with:
          marker: rest.marker
          maxitems: rest.maxitems
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/2013-04-01/healthcheck/{healthcheckid}
      name: 2013-04-01-healthcheck-healthcheckid
      description: REST surface for 2013-04-01-healthcheck-HealthCheckId.
      operations:
      - method: GET
        name: gethealthcheck
        description: Amazon Route 53 Get health check details
        call: amazon-route-53-health-checks.gethealthcheck
        with:
          HealthCheckId: rest.HealthCheckId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: amazon-route-53-health-checks-mcp
    port: 9090
    transport: http
    description: MCP adapter for Amazon Route 53 API — Health Checks. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: amazon-route-53-create-health
      description: Amazon Route 53 Create a health check
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: amazon-route-53-health-checks.createhealthcheck
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: amazon-route-53-list-health
      description: Amazon Route 53 List health checks
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: amazon-route-53-health-checks.listhealthchecks
      with:
        marker: tools.marker
        maxitems: tools.maxitems
      outputParameters:
      - type: object
        mapping: $.
    - name: amazon-route-53-get-health
      description: Amazon Route 53 Get health check details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: amazon-route-53-health-checks.gethealthcheck
      with:
        HealthCheckId: tools.HealthCheckId
      outputParameters:
      - type: object
        mapping: $.
